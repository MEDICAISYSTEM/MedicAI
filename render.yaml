services:
  - type: web
    name: medicai-backend
    env: python
    plan: free
    buildCommand: "pip install fastapi uvicorn supabase python-dotenv pydantic requests passlib bcrypt pyjwt email-validator starlette openai httpx"
    startCommand: "cd backend && uvicorn server:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: WHATSAPP_NUMBER
        sync: false
      - key: OPENAI_API_KEY
        sync: false

  - type: web
    name: medicai-frontend
    env: static
    buildCommand: yarn --cwd frontend install && yarn --cwd frontend build
    staticPublishPath: ./frontend/build
    envVars:
      - key: NODE_VERSION
        value: 20.9.0
      - key: REACT_APP_BACKEND_URL
        fromService:
          type: web
          name: medicai-backend
          envVarKey: RENDER_EXTERNAL_URL

