services:
  - type: web
    name: medicai-backend
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: WHATSAPP_NUMBER
        sync: false
      - key: OPENAI_API_KEY
        sync: false

  - type: web
    name: medicai-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/build
    envVars:
      - key: REACT_APP_BACKEND_URL
        fromService:
          type: web
          name: medicai-backend
          envVarKey: RENDER_EXTERNAL_URL
