services:
  - type: web
    name: medicai-backend
    env: python
    plan: free
    buildCommand: "pip install -r backend/requirements.txt && pip install uvicorn fastapi openai"
    startCommand: "cd backend && uvicorn server:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: WHATSAPP_NUMBER
        sync: false
      - key: OPENAI_API_KEY
        sync: false

  - type: web
    name: medicai-frontend
    env: static
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/build
    envVars:
      - key: NODE_VERSION
        value: 18.17.0
      - key: REACT_APP_BACKEND_URL
        fromService:
          type: web
          name: medicai-backend
          envVarKey: RENDER_EXTERNAL_URL
